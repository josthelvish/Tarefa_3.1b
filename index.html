<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Animalec — Página de Administração do Back-office">
  <title>Gestão do Animalec · Administração</title>
  <link rel="icon" href="animalec.ico">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Montserrat:400,700%7CLato:400,700&amp;display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/animalec.css">
</head>
<body>
  <a class="skip-link" href="#conteudo">Saltar para o conteúdo</a>

  <header id="app-header"></header>

  <main id="conteudo" class="page-section">
    <div class="container">
      <section aria-labelledby="page-title">
        <header class="page-header">
          <h1 id="page-title" class="page-section-heading">Gestão do Animalec</h1>
          <div class="divider-custom" aria-hidden="true">
            <div class="divider-custom-line"></div>
            <div class="divider-custom-icon"><i class="fas fa-star"></i></div>
            <div class="divider-custom-line"></div>
          </div>
        </header>

        <nav aria-label="Áreas de gestão">
          <ul class="admin-grid row list-unstyled">
            <li class="col-6 mb-4">
              <div class="card admin-card bg-secondary is-disabled">
                <span class="card-header">Utilizadores</span>
                <span class="card-body"><i class="fas fa-users" aria-hidden="true"></i>
                  <span class="admin-card-note">Fora do âmbito</span></span>
              </div>
            </li>
            <li class="col-6 mb-4">
              <div class="card admin-card bg-secondary is-disabled">
                <span class="card-header">Animais</span>
                <span class="card-body"><i class="fas fa-dog" aria-hidden="true"></i>
                  <span class="admin-card-note">Fora do âmbito</span></span>
              </div>
            </li>
            <li class="col-6 mb-4">
              <div class="card admin-card bg-secondary is-disabled">
                <span class="card-header">Quizzes</span>
                <span class="card-body"><i class="fas fa-file-alt" aria-hidden="true"></i>
                  <span class="admin-card-note">Fora do âmbito</span></span>
              </div>
            </li>
            <li class="col-6 mb-4">
              <div class="card admin-card bg-secondary is-disabled">
                <span class="card-header">Questões</span>
                <span class="card-body"><i class="fas fa-question-circle" aria-hidden="true"></i>
                  <span class="admin-card-note">Fora do âmbito</span></span>
              </div>
            </li>
            <li class="col-6 mb-4">
              <a class="card admin-card bg-secondary" href="sponsors.html">
                <span class="card-header">Patrocinadores</span>
                <span class="card-body"><i class="fas fa-handshake" aria-hidden="true"></i></span>
              </a>
            </li>
            <li class="col-6 mb-4">
              <a class="card admin-card bg-secondary" href="experts.html">
                <span class="card-header">Especialistas</span>
                <span class="card-body"><i class="fas fa-user-graduate" aria-hidden="true"></i></span>
              </a>
            </li>
          </ul>
        </nav>
      </section>
    </div>
  </main>

  <footer id="app-footer" class="footer"></footer>

  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/header.js"></script>
  <script src="js/footer.js"></script>
</body>
</html>
