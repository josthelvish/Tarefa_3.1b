<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Animalec — Adicionar ou editar patrocinador">
  <title>Adicionar Patrocinador · Animalec</title>
  <link rel="icon" href="animalec.ico">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Montserrat:400,700%7CLato:400,700&amp;display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/animalec.css">
</head>
<body>
  <a class="skip-link" href="#conteudo">Saltar para o conteúdo</a>

  <header id="app-header"></header>

  <main id="conteudo" class="page-section">
    <div class="container">
      <div class="row justify-content-center">
        <section class="col-12 col-lg-8" aria-labelledby="page-title">
          <header class="page-header">
            <h1 id="page-title" class="page-section-heading">Adicionar Patrocinador</h1>
            <div class="divider-custom" aria-hidden="true">
              <div class="divider-custom-line"></div>
              <div class="divider-custom-icon"><i class="fas fa-star"></i></div>
              <div class="divider-custom-line"></div>
            </div>
          </header>

          <form id="sponsor-form" class="entity-form">
            <p class="text-muted small">Os campos assinalados com <span class="required-mark">*</span> são obrigatórios.</p>

            <fieldset>
              <legend>Dados gerais</legend>
              <div class="form-group">
                <label for="sponsor-name">Nome <span class="required-mark" aria-hidden="true">*</span></label>
                <input type="text" class="form-control form-control-lg" id="sponsor-name" name="name"
                       placeholder="Nome do patrocinador" maxlength="100" required>
              </div>
              <div class="form-group">
                <label for="sponsor-type">Tipo</label>
                <select class="custom-select custom-select-lg" id="sponsor-type" name="type">
                  <option value="">-- Seleciona o tipo --</option>
                  <option value="empresa">Empresa</option>
                  <option value="ong">ONG</option>
                  <option value="particular">Particular</option>
                </select>
              </div>
              <div class="form-group">
                <label for="sponsor-description">Descrição</label>
                <textarea class="form-control" id="sponsor-description" name="description" rows="3"
                          placeholder="Breve descrição do patrocinador"></textarea>
              </div>
              <div class="custom-control custom-checkbox">
                <input type="checkbox" class="custom-control-input" id="sponsor-active" name="active" checked>
                <label class="custom-control-label" for="sponsor-active">Ativo</label>
              </div>
            </fieldset>

            <fieldset>
              <legend>Contacto</legend>
              <div class="form-row">
                <div class="form-group col-md-6">
                  <label for="sponsor-email">Email</label>
                  <input type="email" class="form-control form-control-lg" id="sponsor-email" name="email"
                         placeholder="nome@exemplo.pt" autocomplete="email">
                </div>
                <div class="form-group col-md-6">
                  <label for="sponsor-phone">Telefone</label>
                  <input type="tel" class="form-control form-control-lg" id="sponsor-phone" name="phone"
                         placeholder="+351 000 000 000" autocomplete="tel">
                </div>
              </div>
            </fieldset>

            <fieldset>
              <legend>Localização</legend>
              <div class="form-row">
                <div class="form-group col-md-4">
                  <label for="sponsor-city">Cidade</label>
                  <input type="text" class="form-control form-control-lg" id="sponsor-city" name="city">
                </div>
                <div class="form-group col-md-4">
                  <label for="sponsor-district">Distrito</label>
                  <input type="text" class="form-control form-control-lg" id="sponsor-district" name="district">
                </div>
                <div class="form-group col-md-4">
                  <label for="sponsor-country">País</label>
                  <input type="text" class="form-control form-control-lg" id="sponsor-country" name="country" value="Portugal">
                </div>
              </div>
            </fieldset>

            <fieldset>
              <legend>Links</legend>
              <div class="form-row align-items-center">
                <div class="form-group col-md-9">
                  <label for="sponsor-logo">Logótipo (URL)</label>
                  <input type="url" class="form-control form-control-lg" id="sponsor-logo" name="logo"
                         placeholder="https://…/logotipo.png">
                </div>
                <figure class="image-preview col-md-3">
                  <img id="logo-preview-img" src="data:," alt="Logótipo do patrocinador" hidden>
                  <span id="logo-preview-placeholder" class="preview-placeholder" aria-hidden="true">?</span>
                  <figcaption>Pré-visualização</figcaption>
                </figure>
              </div>
              <div class="form-group">
                <label for="sponsor-website">Website</label>
                <input type="url" class="form-control form-control-lg" id="sponsor-website" name="website"
                       placeholder="https://www.exemplo.pt">
              </div>
            </fieldset>

            <fieldset>
              <legend>Patrocínio</legend>
              <div class="form-row">
                <div class="form-group col-md-4">
                  <label for="sponsor-start-date">Data de início</label>
                  <input type="date" class="form-control form-control-lg" id="sponsor-start-date" name="start_date">
                </div>
                <div class="form-group col-md-4">
                  <label for="sponsor-end-date">Data de fim</label>
                  <input type="date" class="form-control form-control-lg" id="sponsor-end-date" name="end_date">
                </div>
                <div class="form-group col-md-4">
                  <label for="sponsor-amount">Montante</label>
                  <div class="input-group input-group-lg">
                    <input type="number" class="form-control" id="sponsor-amount" name="amount" min="0" step="0.01"
                           aria-describedby="amount-currency">
                    <div class="input-group-append"><span class="input-group-text" id="amount-currency">€</span></div>
                  </div>
                </div>
              </div>
            </fieldset>

            <!-- Componente "Animais associados" — só na edição -->
            <fieldset id="associated-animals" hidden>
              <legend>Animais patrocinados</legend>
              <ul id="associated-list" class="chip-list" aria-label="Animais patrocinados"></ul>
              <p id="associated-empty" class="empty-state" hidden>
                <img src="img/avatars/sapo.png" alt="">
                Ainda não há animais associados.
              </p>
              <div class="form-row align-items-end">
                <div class="form-group col-md-8">
                  <label for="animal-select">Associar animal</label>
                  <select class="custom-select custom-select-lg" id="animal-select" aria-describedby="animal-select-help"></select>
                </div>
                <div class="form-group col-md-4">
                  <button type="button" class="btn btn-outline-success btn-lg btn-block" id="associate-button">
                    <i class="fas fa-plus" aria-hidden="true"></i> Associar
                  </button>
                </div>
              </div>
              <small id="animal-select-help" class="form-text text-muted mt-n2">Só são listados animais ainda não associados a este patrocinador.</small>
              <p id="associated-status" class="sr-only" aria-live="polite"></p>
            </fieldset>

            <div class="form-actions">
              <button type="submit" class="btn btn-outline-success btn-lg" id="submit-button">
                <i class="fas fa-save" aria-hidden="true"></i> <span id="submit-label">Adicionar</span>
              </button>
              <a class="btn btn-outline-danger btn-lg" href="sponsors.html">
                <i class="fas fa-times" aria-hidden="true"></i> Cancelar
              </a>
            </div>
          </form>
        </section>
      </div>
    </div>
  </main>

  <footer id="app-footer" class="footer"></footer>

  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/header.js"></script>
  <script src="js/footer.js"></script>
  <script src="js/sponsors.js"></script>
</body>
</html>
